name: Build Debug APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: apna-launcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0 app/build/outputs/apk/debug/app-debug.apk \
            --title "Apna Launcher v1.0" \
            --generate-notes || \
          gh release upload v1.0 app/build/outputs/apk/debug/app-debug.apk --clobber
